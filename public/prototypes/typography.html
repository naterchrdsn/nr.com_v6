<style>

main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:48px 0 39px}.eyebrow{font-size:10px;letter-spacing:.26em;text-transform:uppercase;margin:0 0 16px 6px;color:#c7d3e9;display:flex;align-items:center;gap:16px}.eyebrow:before{content:"";width:43px;height:1px;background:#aebed3}

<body>
<canvas class="sky" id="sky" aria-hidden="true"></canvas>
<div class="shade" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
<div class="page">
<header class="masthead"><span class="edition">A little space to build</span><button class="motion" id="motion" type="button" aria-pressed="false" aria-label="Pause sky motion">Pause motion</button></header>
<main>
<p class="eyebrow">Nate Richardson · Atlanta, GA</p>
<h1 aria-label="Nate Richardson"><span class="first" aria-hidden="true">Nate</span><span class="last" aria-hidden="true">Richardson</span></h1>
<div class="below">
<p class="intro">Frontend architect &amp; developer.<br>I build things at <a href="https://nacholabs.net">Nacho Labs</a>.<span>Helping people do what they love, better.</span></p>

<footer class="review"><a href="/prototypes/index.html">↖ All concepts</a><span class="review-label"><span class="concept-no">03 / 05</span>Typography</span><nav class="review-links" aria-label="Review concepts"><a href="/prototypes/constellation.html" rel="prev">← Previous</a><a href="/prototypes/spectrum.html" rel="next">Next →</a></nav></footer>
</div>
<script>
(() => {
'use strict';
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d', {alpha:false});
const button = document.getElementById('motion');
if (!ctx) { button.hidden=true; return; }
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let paused = reduced.matches, frame=0, clock=0, last=0, width=0, height=0, ratio=1;
// A deterministic, multi-octave density field is baked once. Animation only
// composites this artwork, light veils and a bounded set of dust particles.
let seed=82337;
function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}
const table=new Float32Array(256*256);
for(let i=0;i<table.length;i++) table[i]=random();
function noise(x,y){const a=Math.floor(x),b=Math.floor(y);let u=x-a,v=y-b;u=u*u*(3-2*u);v=v*v*(3-2*v);const i=(a&255),j=(b&255),k=((a+1)&255),l=((b+1)&255);return (table[j*256+i]*(1-u)+table[j*256+k]*u)*(1-v)+(table[l*256+i]*(1-u)+table[l*256+k]*u)*v;}
function fbm(x,y){return noise(x,y)*.53+noise(x*2.07+31,y*2.07+11)*.26+noise(x*4.13+7,y*4.13+29)*.13+noise(x*8.27,y*8.27)*.055+noise(x*16.57,y*16.57)*.025;}
const art=document.createElement('canvas');art.width=1100;art.height=760;
const ac=art.getContext('2d');
const image=ac.createImageData(art.width,art.height),data=image.data;
for(let y=0;y<art.height;y++){
 for(let x=0;x<art.width;x++){
  const u=x/art.width,v=y/art.height;
  const warp=fbm(u*3+17,v*3+6);
  const n=fbm(u*7+warp*2.3,v*7+warp*2.7);
  const detail=fbm(u*18+warp*3,v*18);
  const spine=.60-u*.40+Math.sin(u*7)*.095;
  const distance=(v-spine)+(n-.5)*.38;
  const envelope=Math.exp(-distance*distance*15)*(.5+.5*Math.sin(u*2.5+.3));
  const gas=Math.pow(Math.max(0,n-.22),1.8)*envelope*2.9;
  const ridge=Math.pow(Math.max(0,1-Math.abs(n-.51)*12),3)*envelope;
  const dust=Math.max(0,fbm(u*9+40,v*9+20)-.49)*5*envelope;
  const warmth=Math.max(0,Math.min(1,(u-.4)*2.3));
  const glow=Math.exp(-((u-.73)**2*21+(v-.26)**2*32));
  const dark=Math.max(.12,1-dust*1.55);
  const fleck=(detail-.5)*12;
  const p=(y*art.width+x)*4;
  data[p]=Math.max(0,(8+gas*(68+warmth*102)+ridge*22+glow*27+fleck)*dark);
  data[p+1]=Math.max(0,(12+gas*(91-warmth*28)+ridge*38+glow*38+fleck)*dark);
  data[p+2]=Math.max(0,(25+gas*(163-warmth*56)+ridge*48+glow*54+fleck)*dark);
  data[p+3]=255;
 }
}
ac.putImageData(image,0,0);
// Baked dusty filaments: irregular, branching rather than a gradient wash.
ac.globalCompositeOperation='screen';
for(let k=0;k<75;k++){
 const start=random()*1100,sy=460-start*.30+(random()-.5)*180;
 ac.beginPath();ac.moveTo(start,sy);
 const len=50+random()*250;
 ac.bezierCurveTo(start+len*.3,sy-30-random()*45,start+len*.6,sy+30-random()*80,start+len,sy-35-random()*40);
 ac.strokeStyle=k%3===0?'rgba(238,178,131,.065)':'rgba(136,188,229,.065)';ac.lineWidth=.4+random()*1.8;ac.stroke();
}
ac.globalCompositeOperation='source-over';
const stars=Array.from({length:620},()=>({x:random(),y:random(),r:.2+Math.pow(random(),5)*1.65,a:.15+random()*.68,warm:random()>.77}));
const dust=Array.from({length:95},()=>({x:random(),y:random(),r:.35+random()*.7,s:.25+random()*.75}));
function star(x,y,r,a,warm){ctx.fillStyle=warm?'rgba(255,218,181,'+a+')':'rgba(215,232,255,'+a+')';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function draw(){
 ctx.setTransform(ratio,0,0,ratio,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 ctx.fillStyle='#090c19';ctx.fillRect(0,0,width,height);
 const scale=Math.max(width/1100,height/760),aw=1100*scale,ah=760*scale;
 const offset=(aw-width)*.57;
 ctx.drawImage(art,-offset,-(ah-height)*.30,aw,ah);
 // Broad, soft luminous dust beams traverse the gas over several minutes.
 ctx.save();ctx.globalCompositeOperation='screen';
 const drift=Math.sin(clock*.055)*width*.10;
 ctx.translate(width*.68+drift,height*.16);ctx.rotate(-.48+Math.sin(clock*.025)*.05);
 for(let i=0;i<3;i++){
  const x=(i-1)*width*.15,beam=width*(.032+i*.012);
  const light=ctx.createLinearGradient(x-beam,0,x+beam,0);
  light.addColorStop(0,'rgba(139,184,233,0)');light.addColorStop(.45,'rgba(173,198,233,.035)');light.addColorStop(.52,'rgba(243,218,187,.085)');light.addColorStop(1,'rgba(139,184,233,0)');
  ctx.fillStyle=light;ctx.fillRect(x-beam,-height,beam*2,height*2.3);
 }
 ctx.restore();
 for(const s of stars){
  const x=s.x*width,y=s.y*height;
  star(x,y,s.r,s.a,s.warm);
  if(s.r>1.55){
   const halo=ctx.createRadialGradient(x,y,0,x,y,12);halo.addColorStop(0,'rgba(201,224,255,.24)');halo.addColorStop(1,'rgba(201,224,255,0)');ctx.fillStyle=halo;ctx.fillRect(x-12,y-12,24,24);
   ctx.strokeStyle='rgba(220,235,255,.32)';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+5,y);ctx.moveTo(x,y-5);ctx.lineTo(x,y+5);ctx.stroke();
  }
 }
 // Suspended dust is illuminated gently, never flashed or twinkled.
 for(const p of dust){
  const x=((p.x+clock*.0012*p.s)%1)*width,y=(p.y+Math.sin(clock*.025+p.x*9)*.008)*height;
  const band=Math.exp(-Math.pow((x/width-.68-Math.sin(clock*.055)*.1)*6,2));
  star(x,y,p.r,.05+band*.32,true);
 }
}
function tick(now){
 frame=0;if(paused||document.hidden)return;
 if(last)clock+=Math.min((now-last)/1000,.08);last=now;draw();frame=requestAnimationFrame(tick);
}
function sync(){
 cancelAnimationFrame(frame);frame=0;last=0;
 button.setAttribute('aria-pressed',String(paused));
 button.textContent=paused?'Resume motion':'Pause motion';
 button.setAttribute('aria-label',paused?'Resume sky motion':'Pause sky motion');
 draw();if(!paused&&!document.hidden)frame=requestAnimationFrame(tick);
}
function resize(){
 width=innerWidth;height=innerHeight;ratio=Math.min(devicePixelRatio||1,1.65);
 canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);draw();
}
button.addEventListener('click',()=>{paused=!paused;sync();});
reduced.addEventListener('change',()=>{paused=reduced.matches;sync();});
document.addEventListener('visibilitychange',sync);
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resize,120);});
resize();sync();
})();
</script>
</body>
